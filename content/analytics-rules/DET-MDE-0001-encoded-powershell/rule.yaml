schemaVersion: 1
id: DET-MDE-0001
kind: Scheduled
displayName: PowerShell launched with an encoded command
description: >-
  PowerShell was started with an encoded command argument carrying a long
  base64 payload, a common way to hide script content from casual inspection.
severity: Medium
enabled: true
queryFile: query.kql
queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0
tactics:
  - Execution
  - DefenseEvasion
techniques:
  - T1059.001
  - T1027
eventGroupingSettings:
  aggregationKind: AlertPerResult
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - Host
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: NTDomain
        columnName: AccountDomain
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
customDetails:
  ParentProcess: InitiatingProcessFileName
